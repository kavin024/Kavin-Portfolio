<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="S3 static website CI/CD pipeline preview">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171b"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171c"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#pbg)"/>
  <circle cx="600" cy="380" r="330" fill="#ffffff" opacity="0.03"/>
  <circle cx="1060" cy="90" r="200" fill="#ffffff" opacity="0.03"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 150h1200M0 300h1200M0 450h1200M0 600h1200"/>
    <path d="M150 0v750M300 0v750M450 0v750M600 0v750M750 0v750M900 0v750M1050 0v750"/>
  </g>

  <!-- heading -->
  <text x="600" y="118" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" letter-spacing="5" fill="#6b6b78">DEPLOYMENT PIPELINE</text>
  <text x="600" y="166" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#ececf2">Push to deploy</text>

  <!-- flow line -->
  <path d="M214 330 H340" stroke="url(#flow)" stroke-width="2"/>
  <path d="M470 330 H596" stroke="url(#flow)" stroke-width="2"/>
  <path d="M726 330 H852" stroke="url(#flow)" stroke-width="2"/>
  <path d="M982 330 H1010" stroke="url(#flow)" stroke-width="2"/>

  <g fill="#c9c9d4">
    <path d="M336 325l10 5-10 5z"/>
    <path d="M592 325l10 5-10 5z"/>
    <path d="M848 325l10 5-10 5z"/>
  </g>

  <!-- card 1: repo -->
  <g>
    <rect x="90" y="264" width="124" height="132" rx="16" fill="url(#cardbg)" stroke="#2b2b33"/>
    <circle cx="152" cy="310" r="22" fill="#ffffff" opacity="0.06"/>
    <path d="M143 300v20a4 4 0 0 0 4 4h12" fill="none" stroke="#d4d4de" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M152 310h8a4 4 0 0 1 4 4v6" fill="none" stroke="#d4d4de" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="143" cy="300" r="2.4" fill="#d4d4de"/>
    <circle cx="164" cy="320" r="2.4" fill="#d4d4de"/>
    <text x="152" y="352" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#d4d4de">Git push</text>
    <text x="152" y="372" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6b6b78">main branch</text>
  </g>

  <!-- card 2: actions -->
  <g>
    <rect x="346" y="264" width="124" height="132" rx="16" fill="url(#cardbg)" stroke="#3a3a44"/>
    <circle cx="408" cy="310" r="22" fill="#ffffff" opacity="0.08"/>
    <circle cx="408" cy="310" r="11" fill="none" stroke="#ececf2" stroke-width="1.8"/>
    <path d="M408 304v7l4 3" fill="none" stroke="#ececf2" stroke-width="1.8" stroke-linecap="round"/>
    <text x="408" y="352" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#ececf2">GitHub</text>
    <text x="408" y="372" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6b6b78">Actions</text>
  </g>

  <!-- card 3: aws -->
  <g>
    <rect x="602" y="264" width="124" height="132" rx="16" fill="url(#cardbg)" stroke="#3a3a44"/>
    <circle cx="664" cy="310" r="22" fill="#ffffff" opacity="0.08"/>
    <path d="M653 312a7 7 0 0 1 2-13 9 9 0 0 1 17 3 6 6 0 0 1-1 11h-18z" fill="none" stroke="#ececf2" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="664" y="352" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#ececf2">AWS</text>
    <text x="664" y="372" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6b6b78">S3 sync</text>
  </g>

  <!-- card 4: live -->
  <g>
    <rect x="858" y="264" width="124" height="132" rx="16" fill="url(#cardbg)" stroke="#2b2b33"/>
    <circle cx="920" cy="310" r="22" fill="#4ade80" opacity="0.08"/>
    <circle cx="920" cy="310" r="11" fill="none" stroke="#4ade80" stroke-width="1.8"/>
    <path d="M915 310l3.5 3.5 6.5-7" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="920" y="352" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#ececf2">Live site</text>
    <text x="920" y="372" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6b6b78">HTTPS</text>
  </g>

  <!-- status chip -->
  <g>
    <rect x="966" y="330" width="0" height="0" fill="none"/>
  </g>

  <!-- terminal -->
  <g>
    <rect x="180" y="452" width="840" height="196" rx="14" fill="#0d0d10" stroke="#2b2b33"/>
    <rect x="180" y="452" width="840" height="40" rx="14" fill="#17171b"/>
    <rect x="180" y="478" width="840" height="14" fill="#17171b"/>
    <circle cx="206" cy="472" r="4.5" fill="#3a3a44"/>
    <circle cx="222" cy="472" r="4.5" fill="#3a3a44"/>
    <circle cx="238" cy="472" r="4.5" fill="#3a3a44"/>
    <text x="600" y="477" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#55555f">deploy.yml</text>

    <text x="208" y="524" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#55555f">on:</text>
    <text x="228" y="546" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#8b8b98">push:</text>
    <text x="248" y="568" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#c9c9d4">branches: [ main ]</text>

    <text x="208" y="600" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#55555f">steps:</text>
    <text x="228" y="622" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#8b8b98">- uses: <tspan fill="#ececf2">aws-actions/configure-aws-credentials</tspan></text>
    <text x="228" y="644" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#8b8b98">- run: <tspan fill="#4ade80">aws s3 sync ./ &lt;bucket&gt; --delete</tspan></text>

    <!-- blinking caret -->
    <rect x="820" y="632" width="8" height="15" fill="#c9c9d4">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- badge -->
  <g transform="translate(468,196)">
    <rect width="264" height="34" rx="17" fill="#ffffff" opacity="0.05"/>
    <rect x="1" y="1" width="262" height="32" rx="16" fill="none" stroke="#2b2b33"/>
    <circle cx="26" cy="17" r="4" fill="#4ade80"/>
    <text x="44" y="22" font-family="Inter, Segoe UI, sans-serif" font-size="12" letter-spacing="1.6" fill="#a5a5b3">AUTOMATED ON EVERY COMMIT</text>
  </g>
</svg>
